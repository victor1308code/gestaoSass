<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão SaaS — Autenticação Corporativa</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f8fafc;
      padding: 20px;
    }
    .auth-container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 30px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-logo-badge {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--brand-primary);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    .auth-tab-btn {
      flex: 1;
      text-align: center;
      padding: 8px;
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .auth-tab-btn.active {
      color: var(--brand-primary);
      border-bottom-color: var(--brand-primary);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/><path d="M3 9h18"/><path d="M3 15h18"/>
        </svg>
      </div>
      <h1 style="font-size: 18px; font-weight: 700; color: var(--text-main); letter-spacing:-0.01em;">Gestão SaaS</h1>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">Plataforma de Gestão Organizacional e Pessoas</p>
    </div>

    <!-- TABS LOGIN vs CADASTRO -->
    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tab-btn-login" onclick="switchAuthTab('login')">Acessar Conta</button>
      <button class="auth-tab-btn" id="tab-btn-register" onclick="switchAuthTab('register')">Cadastrar Empresa</button>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">E-mail Corporativo</label>
        <input type="email" id="login-email" class="form-control" placeholder="usuario@empresa.com.br" required />
      </div>

      <div class="form-group">
        <label class="form-label">Senha de Acesso</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required />
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; padding: 8px; margin-top: 8px;">Entrar</button>

      <!-- ACESSO DEMO -->
      <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border-color); text-align: center;">
        <span style="font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Acesso de Demonstração:</span>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button type="button" class="btn btn-outline" style="flex: 1; font-size: 11px;" onclick="fillDemo('admin@teste01.com', 'senha123')">
            TESTE01 (Control iD)
          </button>
          <button type="button" class="btn btn-outline" style="flex: 1; font-size: 11px;" onclick="fillDemo('admin@inovatech.com', 'senha123')">
            InovaTech Demo
          </button>
          <button type="button" class="btn btn-outline" style="flex: 1; font-size: 11px;" onclick="fillDemo('admin@gestaosaas.com', 'admin123')">
            SuperAdmin
          </button>
        </div>
      </div>
    </form>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Nome Fantasia da Empresa *</label>
        <input type="text" id="reg-empresa" class="form-control" placeholder="Ex: Minha Empresa Tech" required />
      </div>

      <div class="form-group">
        <label class="form-label">Nome do Responsável *</label>
        <input type="text" id="reg-responsavel" class="form-control" placeholder="Ex: João Silva" required />
      </div>

      <div class="form-group">
        <label class="form-label">E-mail Profissional *</label>
        <input type="email" id="reg-email" class="form-control" placeholder="joao@empresa.com" required />
      </div>

      <div class="form-group">
        <label class="form-label">Senha de Acesso *</label>
        <input type="password" id="reg-senha" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required />
      </div>

      <button type="submit" id="reg-submit-btn" class="btn btn-primary" style="width: 100%; padding: 8px; margin-top: 8px;">Cadastrar e Começar</button>
    </form>
  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script>
    function switchAuthTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
      document.getElementById('form-register').style.display = isLogin ? 'none' : 'block';
      document.getElementById('tab-btn-login').classList.toggle('active', isLogin);
      document.getElementById('tab-btn-register').classList.toggle('active', !isLogin);
    }

    function fillDemo(email, pass) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pass;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Autenticando...';

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await API.login(email, password);
        API.toast('Autenticado com sucesso.', 'success');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 200);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Cadastrando...';

      const data = {
        nome_fantasia: document.getElementById('reg-empresa').value,
        nome_responsavel: document.getElementById('reg-responsavel').value,
        email: document.getElementById('reg-email').value,
        senha: document.getElementById('reg-senha').value
      };

      try {
        const res = await API.register(data);
        API.toast('Empresa cadastrada.', 'success');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 200);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Cadastrar e Começar';
      }
    }
  </script>
</body>
</html>
