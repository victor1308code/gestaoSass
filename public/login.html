<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talentos — Gestão Organizacional</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, rgba(79, 70, 229, 0.06) 0%, var(--bg-body) 70%);
      padding: 20px;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-modal);
      padding: 36px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo-badge {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--brand-accent-green);
      color: white;
      font-size: 22px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }
    .auth-tab-btn {
      flex: 1;
      text-align: center;
      padding: 10px;
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .auth-tab-btn.active {
      color: var(--brand-primary);
      border-bottom-color: var(--brand-primary);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo-badge">▲</div>
      <h1 style="font-size: 22px; font-weight: 800; color: var(--text-main); letter-spacing:-0.02em;">Talentos</h1>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Plataforma de Gestão dos Times & Organograma</p>
    </div>

    <!-- TABS LOGIN vs CADASTRO -->
    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tab-btn-login" onclick="switchAuthTab('login')">Entrar na Plataforma</button>
      <button class="auth-tab-btn" id="tab-btn-register" onclick="switchAuthTab('register')">Cadastrar Empresa</button>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">E-mail de Acesso</label>
        <input type="email" id="login-email" class="form-control" placeholder="admin@empresa.com.br" required />
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required />
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-green" style="width: 100%; padding: 11px; margin-top: 10px;">Entrar no Painel</button>

      <!-- ACESSO DEMO -->
      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-color); text-align: center;">
        <span style="font-size: 10px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">Acesso Rápido para Demonstração:</span>
        <div style="display: flex; gap: 8px; margin-top: 10px;">
          <button type="button" class="btn btn-outline" style="flex: 1; font-size: 11px;" onclick="fillDemo('admin@inovatech.com', 'senha123')">
            🏢 InovaTech Demo
          </button>
          <button type="button" class="btn btn-outline" style="flex: 1; font-size: 11px;" onclick="fillDemo('admin@gestaosass.com', 'admin123')">
            👑 SuperAdmin
          </button>
        </div>
      </div>
    </form>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Nome Fantasia da Empresa *</label>
        <input type="text" id="reg-empresa" class="form-control" placeholder="Ex: Minha Empresa Tech" required />
      </div>

      <div class="form-group">
        <label class="form-label">Nome do Responsável / Administrador *</label>
        <input type="text" id="reg-responsavel" class="form-control" placeholder="Ex: João da Silva" required />
      </div>

      <div class="form-group">
        <label class="form-label">E-mail Profissional *</label>
        <input type="email" id="reg-email" class="form-control" placeholder="joao@minhaempresa.com" required />
      </div>

      <div class="form-group">
        <label class="form-label">Senha de Acesso *</label>
        <input type="password" id="reg-senha" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required />
      </div>

      <button type="submit" id="reg-submit-btn" class="btn btn-green" style="width: 100%; padding: 11px; margin-top: 10px;">Criar Conta & Começar</button>
    </form>
  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script>
    function switchAuthTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
      document.getElementById('form-register').style.display = isLogin ? 'none' : 'block';
      document.getElementById('tab-btn-login').classList.toggle('active', isLogin);
      document.getElementById('tab-btn-register').classList.toggle('active', !isLogin);
    }

    function fillDemo(email, pass) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pass;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Autenticando...';

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await API.login(email, password);
        API.toast('Login realizado com sucesso! Redirecionando...', 'success');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 300);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Entrar no Painel';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Criando conta...';

      const data = {
        nome_fantasia: document.getElementById('reg-empresa').value,
        nome_responsavel: document.getElementById('reg-responsavel').value,
        email: document.getElementById('reg-email').value,
        senha: document.getElementById('reg-senha').value
      };

      try {
        const res = await API.register(data);
        API.toast('Empresa criada com sucesso! Entrando...', 'success');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 300);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Criar Conta & Começar';
      }
    }
  </script>
</body>
</html>
